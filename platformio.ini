[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial Monitor settings
monitor_speed = 115200
monitor_filters = default

; Upload settings
upload_speed = 115200

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    ; TFT_eSPI configuration
    ; The User_Setup.h file in include/ will be automatically copied to TFT_eSPI library
    ; Edit include/User_Setup.h to adjust display pins and settings
    ; Note: Do NOT define USER_SETUP_LOADED - let TFT_eSPI include User_Setup.h normally

; Library dependencies
lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; Board-specific settings
board_build.partitions = default.csv
board_build.filesystem = littlefs
board_build.flash_size = 4MB

; FreeRTOS settings
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

; Extra scripts - copy User_Setup.h to TFT_eSPI library
extra_scripts = extra_scripts.py

